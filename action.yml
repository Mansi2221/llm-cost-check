name: 'LLM Cost Check'
description: 'Estimate LLM API cost changes on pull requests that modify prompts or model configurations'
author: 'Mansi2221'

branding:
  icon: 'dollar-sign'
  color: 'green'

inputs:
  github-token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: ${{ github.token }}
  base-ref:
    description: 'Base ref to diff against'
    required: false
    default: ''
  head-ref:
    description: 'Head ref to diff'
    required: false
    default: ''
  comment-threshold:
    description: 'Only comment when estimated monthly cost change exceeds this amount (USD)'
    required: false
    default: '0'
  calls-per-month:
    description: 'Estimated LLM calls per month for cost projection'
    required: false
    default: '10000'

outputs:
  cost-report:
    description: 'Markdown cost report'
    value: ${{ steps.analyze.outputs.report }}
  has-llm-changes:
    description: 'Whether the PR contains LLM-related changes'
    value: ${{ steps.analyze.outputs.has_changes }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Get diff
      id: diff
      shell: bash
      run: |
        BASE_REF="${{ inputs.base-ref || github.event.pull_request.base.sha }}"
        HEAD_REF="${{ inputs.head-ref || github.event.pull_request.head.sha }}"
        git fetch --depth=1 origin "$BASE_REF" 2>/dev/null || true
        git diff "$BASE_REF"..."$HEAD_REF" > /tmp/pr_diff.txt 2>/dev/null || \
          git diff "$BASE_REF".."$HEAD_REF" > /tmp/pr_diff.txt 2>/dev/null || \
          git diff HEAD~1 > /tmp/pr_diff.txt

    - name: Analyze LLM cost changes
      id: analyze
      shell: bash
      run: |
        REPORT=$(python3 -I "${{ github.action_path }}/scripts/detect_llm_changes.py" \
          --diff /tmp/pr_diff.txt \
          --pricing "${{ github.action_path }}/scripts/pricing.json" \
          --calls-per-month "${{ inputs.calls-per-month }}")
        HAS_CHANGES=$?
        if [ "$HAS_CHANGES" -eq 0 ]; then
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        fi
        {
          echo "report<<LLMCOSTEOF"
          echo "$REPORT"
          echo "LLMCOSTEOF"
        } >> "$GITHUB_OUTPUT"

    - name: Comment on PR
      if: steps.analyze.outputs.has_changes == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = '<!-- llm-cost-check -->';
          const report = `${marker}\n${{ steps.analyze.outputs.report }}\n${marker}`;
          const threshold = parseFloat('${{ inputs.comment-threshold }}');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body?.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: report,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report,
            });
          }
